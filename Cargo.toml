[package]
name = "runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = [
    ".",
    "grammar",
    "leetcode",
    "more_crates",
]

[dependencies]
csv = "1.3.0"
rand = "0.8.5"
log = "0.4.21"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"

# workspace lib path
grammar = { path = "grammar" }
leetcode = { path = "leetcode" }
third_party_crates = { path = "more_crates" }

# standard crate data is left out
[dev-dependencies]
pretty_assertions = "1.4.0"
