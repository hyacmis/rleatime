[package]
name = "runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "runtime-binary"
path = "src/main.rs"

[workspace]
resolver = "2"
members = [
    ".",
    "grammar",
    "leetcode",
    "more_crates",
    "download_cli",
]

[dependencies]
# workspace lib path
grammar = { path = "grammar" }
leetcode = { path = "leetcode" }
more_crates = { path = "more_crates" }

csv = "1.3.0"
rand = "0.8.5"
log = "0.4.21"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
piston_window = "0.132.0"


# standard crate data is left out
[dev-dependencies]
pretty_assertions = "1.4.0"
