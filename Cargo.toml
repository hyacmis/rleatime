[package]
name = "runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = [
    ".",
    "grammar",
    "leetcode",
    "more_crates",
    "snake",
    "download_cli",
]

[workspace.package]
version = "0.1.0"
authors = ["coufxr"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
rand = "0.8.5"
tokio = { version = "1.37.0", features = ["full"] }
futures = "0.3.30"
anyhow = "1.0.86"
url = "2.5.1"
indicatif = "0.17.8"
reqwest = { version = "0.12.4", features = ["stream", "json"] }

[dependencies]
# workspace lib path
grammar = { path = "grammar" }
leetcode = { path = "leetcode" }
more_crates = { path = "more_crates" }

rand.workspace = true
serde.workspace = true
serde_json.workspace = true

csv = "1.3.0"
log = "0.4.21"
