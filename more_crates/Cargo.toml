[package]
name = "more_crates"
version = "0.1.0"
edition = "2021"
description = "学习第三方库"
license = "MIT"

[dependencies]
serde_repr = "0.1.19"
strum_macros = "0.26.2"
strum = { version = "0.26.2", features = ["derive"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
reqwest = { version = "0.12.4", features = ["json"] }
chrono = { version = "0.4.38", features = ["serde"] }
dotenvy = "0.15.7"
config = "0.14.0"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
tokio = { version = "1.37.0", features = ["full"] }
anyhow = "1.0.86"
thiserror = "1.0.61"
url = "2.5.1"
indicatif = "0.17.8"
